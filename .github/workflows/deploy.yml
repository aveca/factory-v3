name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "Deploying commit ${{ github.sha }}"
          echo "Deploy triggered by workflow run ${{ github.run_id }}"
          # Simulate deployment - in real scenario this would deploy to Cloudflare Workers, etc.
          sleep 2
          echo "Deployment successful"
      
      - name: Record deployment info
        run: |
          echo "DEPLOY_COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "DEPLOY_RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV
          echo "DEPLOY_STATUS=success" >> $GITHUB_ENV
      
      - name: Output deployment info
        run: |
          echo "Deployment completed for commit ${{ github.sha }}"
          echo "Workflow run ID: ${{ github.run_id }}"