name: Factory V3 CI

on:
  push:
    branches: [master, factory-e2e-002]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify marker file exists
        run: test -f FACTORY_E2E_MARKER_factory-full-e2e-20261007-002.txt
      
      - name: Print JOB_ID
        run: echo "JOB_ID: $JOB_ID"