name: Factory V3 Quota Guard CI

# CI REELLE : execute la verification de syntaxe ET les tests du quota guard.
# Un simple `echo` n est PAS une preuve de test (issue #7).

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]

jobs:
  syntax-check:
    name: Syntaxe de tous les fichiers Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verification syntaxique (node --check)
        run: |
          set -e
          fail=0
          for f in $(find lib -name '*.cjs' | sort); do
            if ! node --check "$f"; then
              echo "::error file=$f::Syntaxe invalide"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Syntaxe OK sur $(find lib -name '*.cjs' | wc -l) fichier(s)"

  quota-guard-tests:
    name: Tests de non-regression quota guard P5.7
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execution reelle des tests de non-regression
        run: node lib/tests/regression-p5.7.test.cjs
      - name: Verification qu'aucun fichier ':memory:' n'est cree
        run: |
          set -e
          node -e "
            const { QuotaStore } = require('./lib/quota-store.cjs');
            const fs = require('fs');
            new QuotaStore(':memory:').save();
            if (fs.existsSync(':memory:')) { console.error('ECHEC: fichier :memory: cree'); process.exit(1); }
            console.log('OK: aucun fichier :memory: cree');
          "

